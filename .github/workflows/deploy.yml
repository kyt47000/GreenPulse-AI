name: Deploy GreenPulse AI → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time; cancel any in-flight run on new push
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ─────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Install ─────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # ── 4. Build ───────────────────────────────────────────────────
      - name: Build frontend for production
        run: npm run build
        working-directory: frontend
        env:
          NODE_ENV: production
          # Render backend URL — set this secret in GitHub repo Settings
          # Settings → Secrets → Actions → New repository secret
          # Name: VITE_API_URL  Value: https://YOUR-APP.onrender.com/api
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # ── 5. Upload artifact ─────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      # ── 6. Deploy ──────────────────────────────────────────────────
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
